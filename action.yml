name: 'Format YAML'
description: 'Format YAML files (GitHub Actions workflows/actions) using Prettier'
author: 'Thibaut Durand'
branding:
  icon: 'align-left'
  color: 'blue'

inputs:
  path:
    description: 'Path(s) to format, space-separated glob patterns'
    required: false
    default: '.github/**/*.yml .github/**/*.yaml'
  prettier-version:
    description: 'Version (or dist-tag) of Prettier to use'
    required: false
    default: 'latest'
  node-version:
    description: 'Version of Node.js to use'
    required: false
    default: 'lts/*'
  config-path:
    description: "Path to a Prettier config file to use. Defaults to this action's own .prettierrc.yml"
    required: false
    default: ''
  check:
    description: 'Check formatting without writing changes. Fails the action if any file is not formatted'
    required: false
    default: 'false'

outputs:
  changed:
    description: 'Whether any file was reformatted (write mode) or is not correctly formatted (check mode)'
    value: ${{ steps.format.outputs.changed }}

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Format YAML files
      id: format
      shell: bash
      env:
        CONFIG_PATH: ${{ inputs.config-path || format('{0}/.prettierrc.yml', github.action_path) }}
        PRETTIER_VERSION: ${{ inputs.prettier-version }}
        PATTERNS: ${{ inputs.path }}
        CHECK: ${{ inputs.check }}
      run: |
        # shellcheck disable=SC2206 # PATTERNS is intentionally split into
        # multiple glob-pattern arguments on unquoted whitespace.
        patterns=($PATTERNS)

        if [ "$CHECK" = 'true' ]; then
          if npx --yes prettier@"$PRETTIER_VERSION" --config "$CONFIG_PATH" --no-error-on-unmatched-pattern --check "${patterns[@]}"; then
            echo 'changed=false' >>"$GITHUB_OUTPUT"
          else
            echo 'changed=true' >>"$GITHUB_OUTPUT"
            exit 1
          fi
        else
          changed_files=$(npx --yes prettier@"$PRETTIER_VERSION" --config "$CONFIG_PATH" --no-error-on-unmatched-pattern --write --list-different "${patterns[@]}")
          if [ -n "$changed_files" ]; then
            echo 'changed=true' >>"$GITHUB_OUTPUT"
          else
            echo 'changed=false' >>"$GITHUB_OUTPUT"
          fi
        fi
