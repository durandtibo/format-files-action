name: "Format Files"
description: "Format YAML, Makefiles, shell scripts, and Markdown files using 'make format'"
author: "Thibaut Durand"
branding:
  icon: "align-left"
  color: "blue"

inputs:
  node-version:
    description: "Version of Node.js to use (needed by prettier and markdownlint)"
    required: false
    default: "lts/*"
  check:
    description: "Check formatting without writing changes. Fails the action if any file is not formatted"
    required: false
    default: "false"
  create-pull-request:
    description: "Open a pull request with the formatting changes using peter-evans/create-pull-request. Ignored when 'check' is true"
    required: false
    default: "true"
  token:
    description: "Token used by peter-evans/create-pull-request to create the pull request. Ignored if 'github-app-client-id' is set"
    required: false
    default: ${{ github.token }}
  github-app-client-id:
    description: "Client ID of a GitHub App used to generate a token for creating the pull request, instead of 'token'"
    required: false
    default: ""
  github-app-private-key:
    description: "Private key of the GitHub App identified by 'github-app-client-id'"
    required: false
    default: ""
  branch:
    description: "Branch name used by peter-evans/create-pull-request"
    required: false
    default: "bot/format-files"
  commit-message:
    description: "Commit message used by peter-evans/create-pull-request"
    required: false
    default: "style: format files"
  title:
    description: "Pull request title used by peter-evans/create-pull-request"
    required: false
    default: "style: format files"
  body:
    description: "Pull request body used by peter-evans/create-pull-request"
    required: false
    default: "Format YAML, Makefile, shell, and Markdown files."

outputs:
  changed:
    description: "Whether any file was reformatted (write mode) or is not correctly formatted (check mode)"
    value: ${{ steps.format.outputs.changed }}
  pull-request-number:
    description: "Number of the pull request created with the formatting changes, if any"
    value: ${{ steps.create-pull-request.outputs.pull-request-number }}
  pull-request-url:
    description: "URL of the pull request created with the formatting changes, if any"
    value: ${{ steps.create-pull-request.outputs.pull-request-url }}

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # ratchet:actions/setup-node@v7.0.0
      with:
        node-version: ${{ inputs.node-version }}

    - name: Format files
      id: format
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        CHECK: ${{ inputs.check }}
      run: |
        make --file="$ACTION_PATH/Makefile" format

        if git diff --quiet; then
          echo 'changed=false' >>"$GITHUB_OUTPUT"
        else
          echo 'changed=true' >>"$GITHUB_OUTPUT"
          if [ "$CHECK" = 'true' ]; then
            git checkout -- .
            exit 1
          fi
        fi

    - name: Generate GitHub App token
      id: app-token
      if: inputs.check != 'true' && inputs.create-pull-request == 'true' && steps.format.outputs.changed == 'true' && inputs.github-app-client-id != '' && inputs.github-app-private-key != ''
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # ratchet:actions/create-github-app-token@v3.2.0
      with:
        client-id: ${{ inputs.github-app-client-id }}
        private-key: ${{ inputs.github-app-private-key }}
        permission-contents: write
        permission-pull-requests: write
        permission-workflows: write

    - name: Create pull request
      id: create-pull-request
      if: inputs.check != 'true' && inputs.create-pull-request == 'true' && steps.format.outputs.changed == 'true'
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # ratchet:peter-evans/create-pull-request@v8
      with:
        token: ${{ steps.app-token.outputs.token || inputs.token }}
        branch: ${{ inputs.branch }}
        commit-message: ${{ inputs.commit-message }}
        title: ${{ inputs.title }}
        body: ${{ inputs.body }}
