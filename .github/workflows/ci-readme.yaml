# Check that the inputs, outputs and defaults documented in README.md are those of action.yml
# (`make check-readme`, dev/check_readme_sync.sh), so the docs cannot drift from the action.

name: Check README
on:
  workflow_call:
  workflow_dispatch: # to trigger manually

permissions: {}

jobs:
  check-readme:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Check the README against action.yml
        run: |
          make check-readme
