# Workflow testing the action from the current repository code (uses: ./)
# on multiple operating systems. Badly formatted YAML, Makefile, shell, TOML, and
# Markdown fixtures are generated at runtime (not committed) so the repo's own
# scheduled format bot never "fixes" them into formatted, useless fixtures.
# Covers write mode (reformats + reports changed=true, is idempotent), and check
# mode (fails and leaves the working tree untouched on unformatted input,
# succeeds on already-formatted input), and a repository that does not contain the
# action's own Makefile/.make/ (the action must not depend on the caller's directory),
# an empty repository, files excluded by .prettierignore/.gitignore, each file type on its own
# in check mode, check mode never opening a pull request, and exact formatted content for
# nested directories and file names with spaces.
# The consumer-repository jobs are not mirrored in nightly-test-released.yaml until a
# release contains the include-path fix.
# It is mirrored by nightly-test-released.yaml, which tests the latest release.

name: Test Action
on:
  workflow_call:
    inputs:
      test-matrix:
        description: "JSON test matrix from lib-get-test-matrix.yaml, loaded once by the caller"
        required: true
        type: string

permissions: {}

jobs:
  format-write:
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.test-matrix).os_matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Create badly formatted fixtures
        shell: bash
        run: |
          mkdir -p tmp-format-test
          printf 'foo:    bar\nbaz:  qux\n' >tmp-format-test/bad.yaml
          # shellcheck disable=SC2016 # writing literal shell source as data, not expanding it here
          printf '# bad shell\nfoo="bar"\nif [ "$foo" = "bar" ]; then\necho ok\nfi\n' >tmp-format-test/bad.sh
          printf '#   heading\n\n*  item\n*   item2\n' >tmp-format-test/bad.md
          printf '[package]\nname    =    "x"\n' >tmp-format-test/bad.toml
          printf 'all:\n\t@echo hi\nfoo:=1\n' >bad.mk
          git add -A
          git -c user.name=test -c user.email=test@example.com commit -m 'test: add unformatted fixtures' --quiet

      - name: Run format action
        id: format
        uses: ./
        with:
          create-pull-request: false

      - name: Assert action reports changed=true
        shell: bash
        env:
          CHANGED: ${{ steps.format.outputs.changed }}
        run: test "$CHANGED" = "true"

      - name: Assert each fixture was reformatted
        shell: bash
        run: |
          for file in tmp-format-test/bad.yaml tmp-format-test/bad.sh tmp-format-test/bad.md tmp-format-test/bad.toml bad.mk; do
            if git diff --quiet -- "$file"; then
              echo "expected $file to be reformatted, but found no diff"
              exit 1
            fi
          done
          git add -A
          git -c user.name=test -c user.email=test@example.com commit -m 'test: reformatted fixtures' --quiet

      - name: Run format action again (idempotency)
        id: format-again
        uses: ./
        with:
          create-pull-request: false

      - name: Assert action reports changed=false
        shell: bash
        env:
          CHANGED: ${{ steps.format-again.outputs.changed }}
        run: test "$CHANGED" = "false"

  format-check:
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.test-matrix).os_matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Create badly formatted fixtures
        shell: bash
        run: |
          mkdir -p tmp-format-test
          printf 'foo:    bar\nbaz:  qux\n' >tmp-format-test/bad.yaml
          # shellcheck disable=SC2016 # writing literal shell source as data, not expanding it here
          printf '# bad shell\nfoo="bar"\nif [ "$foo" = "bar" ]; then\necho ok\nfi\n' >tmp-format-test/bad.sh
          printf '#   heading\n\n*  item\n*   item2\n' >tmp-format-test/bad.md
          printf '[package]\nname    =    "x"\n' >tmp-format-test/bad.toml
          printf 'all:\n\t@echo hi\nfoo:=1\n' >bad.mk
          git add -A
          git -c user.name=test -c user.email=test@example.com commit -m 'test: add unformatted fixture' --quiet

      # The error annotation of this step is expected: the step must fail
      - name: Run format action in check mode
        id: format
        continue-on-error: true
        uses: ./
        with:
          check: true
          create-pull-request: false

      - name: Assert action failed and reported changed=true
        shell: bash
        env:
          OUTCOME: ${{ steps.format.outcome }}
          CHANGED: ${{ steps.format.outputs.changed }}
        run: |
          test "$OUTCOME" = "failure"
          test "$CHANGED" = "true"

      - name: Assert no changes were left on disk
        shell: bash
        run: test -z "$(git status --porcelain)"

  format-check-clean:
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.test-matrix).os_matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Run format action in check mode against an already-formatted repo
        id: format
        uses: ./
        with:
          check: true
          create-pull-request: false

      - name: Assert action succeeded and reported changed=false
        shell: bash
        env:
          OUTCOME: ${{ steps.format.outcome }}
          CHANGED: ${{ steps.format.outputs.changed }}
        run: |
          test "$OUTCOME" = "success"
          test "$CHANGED" = "false"

  # Regression test for the action being run on a repository that does not contain the action's
  # own Makefile/.make/. The action is checked out in a subdirectory, and the workspace root is
  # a fresh consumer-like repository.
  format-consumer-repo:
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.test-matrix).os_matrix }}

    steps:
      - name: Checkout the action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          path: action-src

      - name: Create a consumer repository with a badly formatted fixture
        shell: bash
        run: |
          git init --quiet
          printf 'action-src/\n' >.gitignore
          printf 'foo:    bar\nbaz:  qux\n' >bad.yaml
          git add -A
          git -c user.name=test -c user.email=test@example.com commit -m 'test: add unformatted fixture' --quiet
          test ! -e .make
          test ! -e Makefile

      - name: Run format action
        id: format
        uses: ./action-src
        with:
          create-pull-request: false

      - name: Assert action reports changed=true
        shell: bash
        env:
          CHANGED: ${{ steps.format.outputs.changed }}
        run: test "$CHANGED" = "true"

      - name: Assert fixture was reformatted
        shell: bash
        run: |
          if git diff --quiet -- bad.yaml; then
            echo "expected bad.yaml to be reformatted, but found no diff"
            exit 1
          fi

  # An empty repository (no file the action formats) is a success in both modes
  format-no-files:
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.test-matrix).os_matrix }}

    steps:
      - name: Checkout the action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          path: action-src

      - name: Create a consumer repository with nothing to format
        shell: bash
        run: |
          git init --quiet
          printf 'action-src/\n' >.gitignore
          git add -A
          git -c user.name=test -c user.email=test@example.com commit -m 'test: empty repository' --quiet

      - name: Run format action in write mode
        id: write
        uses: ./action-src
        with:
          create-pull-request: false

      - name: Run format action in check mode
        id: check
        uses: ./action-src
        with:
          check: true
          create-pull-request: false

      - name: Assert both runs succeeded with changed=false
        shell: bash
        env:
          WRITE_CHANGED: ${{ steps.write.outputs.changed }}
          CHECK_CHANGED: ${{ steps.check.outputs.changed }}
        run: |
          test "$WRITE_CHANGED" = "false"
          test "$CHECK_CHANGED" = "false"
          test -z "$(git status --porcelain)"

  # Files excluded through .prettierignore and .gitignore are left untouched
  format-ignored-files:
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.test-matrix).os_matrix }}

    steps:
      - name: Checkout the action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          path: action-src

      - name: Create a consumer repository with ignored, badly formatted files
        shell: bash
        run: |
          git init --quiet
          printf 'action-src/\nignored-by-git.yaml\n' >.gitignore
          printf 'ignored-by-prettier.yaml\n' >.prettierignore
          printf 'foo:    bar\n' >ignored-by-prettier.yaml
          printf 'foo:    bar\n' >ignored-by-git.yaml
          git add -A
          git -c user.name=test -c user.email=test@example.com commit -m 'test: add ignored fixtures' --quiet

      - name: Run format action
        id: format
        uses: ./action-src
        with:
          create-pull-request: false

      - name: Assert ignored files were left untouched
        shell: bash
        env:
          CHANGED: ${{ steps.format.outputs.changed }}
        run: |
          test "$CHANGED" = "false"
          test "$(cat ignored-by-prettier.yaml)" = 'foo:    bar'
          test "$(cat ignored-by-git.yaml)" = 'foo:    bar'

  # Check mode must detect each file type on its own, fail, and leave the tree untouched
  format-check-per-type:
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.test-matrix).os_matrix }}
        fixture: [yaml, shell, markdown, toml, makefile]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Create one badly formatted fixture
        shell: bash
        env:
          FIXTURE: ${{ matrix.fixture }}
        run: |
          mkdir -p tmp-format-test
          case "$FIXTURE" in
            yaml) printf 'foo:    bar\nbaz:  qux\n' >tmp-format-test/bad.yaml ;;
            shell) printf '# bad shell\nif true; then\necho ok\nfi\n' >tmp-format-test/bad.sh ;;
            markdown) printf '#   heading\n\n*  item\n*   item2\n' >tmp-format-test/bad.md ;;
            toml) printf '[package]\nname    =    "x"\n' >tmp-format-test/bad.toml ;;
            makefile) printf 'all:\n\t@echo hi\nfoo:=1\n' >tmp-format-test/bad.mk ;;
          esac
          git add -A
          git -c user.name=test -c user.email=test@example.com commit -m 'test: add unformatted fixture' --quiet

      # The error annotation of this step is expected: the step must fail
      - name: Run format action in check mode
        id: format
        continue-on-error: true
        uses: ./
        with:
          check: true
          create-pull-request: false

      - name: Assert the action failed, reported changed=true and left the tree untouched
        shell: bash
        env:
          OUTCOME: ${{ steps.format.outcome }}
          CHANGED: ${{ steps.format.outputs.changed }}
        run: |
          test "$OUTCOME" = "failure"
          test "$CHANGED" = "true"
          test -z "$(git status --porcelain)"

  # Check mode never opens a pull request, even when create-pull-request is true
  format-check-no-pull-request:
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.test-matrix).os_matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Create a badly formatted fixture
        shell: bash
        run: |
          printf 'foo:    bar\n' >tmp-bad.yaml
          git add -A
          git -c user.name=test -c user.email=test@example.com commit -m 'test: add unformatted fixture' --quiet

      # The error annotation of this step is expected: the step must fail
      - name: Run format action in check mode with create-pull-request enabled
        id: format
        continue-on-error: true
        uses: ./
        with:
          check: true
          create-pull-request: true

      - name: Assert it failed without creating a pull request
        shell: bash
        env:
          OUTCOME: ${{ steps.format.outcome }}
          PR_NUMBER: ${{ steps.format.outputs.pull-request-number }}
          PR_URL: ${{ steps.format.outputs.pull-request-url }}
        run: |
          test "$OUTCOME" = "failure"
          test -z "$PR_NUMBER"
          test -z "$PR_URL"
          test -z "$(git status --porcelain)"

  # Write mode produces the exact formatted output, handles nested directories and file names
  # with spaces, and does not open a pull request when create-pull-request is false
  format-write-content:
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.test-matrix).os_matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Create badly formatted fixtures
        shell: bash
        run: |
          mkdir -p 'tmp-format-test/dir with space/nested'
          printf 'foo:    bar\n' >'tmp-format-test/dir with space/nested/bad file.yaml'
          printf '[package]\nname    =    "x"\n' >tmp-format-test/bad.toml
          printf 'foo:    bar' >tmp-format-test/no-trailing-newline.yaml
          git add -A
          git -c user.name=test -c user.email=test@example.com commit -m 'test: add unformatted fixtures' --quiet

      - name: Run format action
        id: format
        uses: ./
        with:
          create-pull-request: false

      - name: Assert exact formatted content and outputs
        shell: bash
        env:
          CHANGED: ${{ steps.format.outputs.changed }}
          PR_NUMBER: ${{ steps.format.outputs.pull-request-number }}
          PR_URL: ${{ steps.format.outputs.pull-request-url }}
        run: |
          test "$CHANGED" = "true"
          test -z "$PR_NUMBER"
          test -z "$PR_URL"
          test "$(cat 'tmp-format-test/dir with space/nested/bad file.yaml')" = 'foo: bar'
          test "$(cat tmp-format-test/no-trailing-newline.yaml)" = 'foo: bar'
          test "$(tail -c1 tmp-format-test/no-trailing-newline.yaml | wc -l | tr -d ' ')" = '1'
          grep -q 'name = "x"' tmp-format-test/bad.toml
