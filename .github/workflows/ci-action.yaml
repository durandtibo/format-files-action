# Workflow testing the action end to end. One file serves both test levels (use-released):
#   - use-released: false (ci.yaml): the action from this checkout (uses: ./), i.e. the version
#     not released yet.
#   - use-released: true (nightly.yaml): the latest released action
#     (durandtibo/format-files-action@v0.1.0), to catch regressions in what consumers pick up.
#     Update the pinned release below (and this comment) when a new version is released.
# Every case runs both ways: each "Run format action" step exists twice (local and released)
# and the assertions read whichever one ran.
#
# It can also be run alone (workflow_dispatch): the get-matrix job then loads the OS lists.
#
# Badly formatted YAML, Makefile, shell, TOML, and Markdown fixtures are generated at runtime
# (not committed) so the repo's own scheduled format bot never "fixes" them.
#
# General behaviour runs on the full OS matrix (os_matrix from lib-get-test-matrix.yaml):
#   - test: the default usage (write mode) reformats, reports changed=true, is idempotent.
#   - test-check: the main documented usage (check mode) fails on unformatted input and leaves
#     the tree untouched.
#   - test-check-clean: check mode succeeds on already-formatted input.
# Edge cases run on the *-latest runners only (os_latest), because they exercise one input or
# one unusual file, not the portability of the tools:
#   - test-consumer-repo, test-no-files, test-ignored-files: a repository that does not
#     contain the action's own Makefile/.make/, an empty repository, files excluded by
#     .prettierignore/.gitignore. Local only until a release contains the include-path fix.
#   - test-check-per-type: each file type on its own in check mode.
#   - test-check-no-pull-request: check mode never opens a pull request.
#   - test-write-content: exact formatted content for nested directories and names with spaces.
#   - test-export: the action runs from the exported archive (git archive), what a release ships.
#     Local only: the released action is already the archive.
# Every negative test (check mode that must fail) first runs the same check on formatted input on
# the same runner (positive control), so it cannot fail for the wrong reason.
#
# Cells per run: 3 general jobs x the OS matrix + 6 edge jobs x os_latest + test-check-per-type
# (5 file types x os_latest). Every job has timeout-minutes and fail-fast: false.
# The pull request creation itself is not tested here: it needs write access, and tests have no
# side effects outside the runner.

name: Test Action
on:
  workflow_call:
    inputs:
      test-matrix:
        description: "JSON test matrix from lib-get-test-matrix.yaml, loaded once by the caller"
        required: true
        type: string
      use-released:
        description: "Test the latest released action instead of the one in this checkout"
        required: false
        default: false
        type: boolean
  workflow_dispatch: # to run the tests alone; the matrix is loaded by the get-matrix job
    inputs:
      use-released:
        description: "Test the latest released action instead of the one in this checkout"
        required: false
        default: false
        type: boolean

permissions: {}

jobs:
  # Only when run alone (workflow_dispatch): the callers pass `test-matrix` themselves.
  get-matrix:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/lib-get-test-matrix.yaml
    permissions:
      contents: read

  test:
    needs: get-matrix
    if: ${{ !cancelled() && (needs.get-matrix.result == 'success' || needs.get-matrix.result == 'skipped') }}
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.test-matrix || needs.get-matrix.outputs.test_matrix).os_matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Create badly formatted fixtures
        shell: bash
        run: |
          mkdir -p tmp-format-test
          printf 'foo:    bar\nbaz:  qux\n' >tmp-format-test/bad.yaml
          # shellcheck disable=SC2016 # writing literal shell source as data, not expanding it here
          printf '# bad shell\nfoo="bar"\nif [ "$foo" = "bar" ]; then\necho ok\nfi\n' >tmp-format-test/bad.sh
          printf '#   heading\n\n*  item\n*   item2\n' >tmp-format-test/bad.md
          printf '[package]\nname    =    "x"\n' >tmp-format-test/bad.toml
          printf 'all:\n\t@echo hi\nfoo:=1\n' >bad.mk
          git add -A
          git -c user.name=test -c user.email=test@example.com commit -m 'test: add unformatted fixtures' --quiet

      - name: Run format action (local)
        id: format
        if: ${{ !inputs.use-released }}
        uses: ./
        with:
          create-pull-request: false
      - name: Run format action (released)
        id: format-released
        if: ${{ inputs.use-released }}
        uses: durandtibo/format-files-action@d616f6af5d74f644f80dbcb47932d3ee73d611ba # ratchet:durandtibo/format-files-action@v0.1.0
        with:
          create-pull-request: false

      - name: Assert action reports changed=true
        shell: bash
        env:
          CHANGED: ${{ steps.format.outputs.changed || steps.format-released.outputs.changed }}
        run: test "$CHANGED" = "true"

      - name: Assert each fixture was reformatted
        shell: bash
        run: |
          for file in tmp-format-test/bad.yaml tmp-format-test/bad.sh tmp-format-test/bad.md tmp-format-test/bad.toml bad.mk; do
            if git diff --quiet -- "$file"; then
              echo "expected $file to be reformatted, but found no diff"
              exit 1
            fi
          done
          git add -A
          git -c user.name=test -c user.email=test@example.com commit -m 'test: reformatted fixtures' --quiet

      - name: Run format action again (idempotency) (local)
        id: format-again
        if: ${{ !inputs.use-released }}
        uses: ./
        with:
          create-pull-request: false
      - name: Run format action again (idempotency) (released)
        id: format-again-released
        if: ${{ inputs.use-released }}
        uses: durandtibo/format-files-action@d616f6af5d74f644f80dbcb47932d3ee73d611ba # ratchet:durandtibo/format-files-action@v0.1.0
        with:
          create-pull-request: false

      - name: Assert action reports changed=false
        shell: bash
        env:
          CHANGED: ${{ steps.format-again.outputs.changed || steps.format-again-released.outputs.changed }}
        run: test "$CHANGED" = "false"
  test-check:
    needs: get-matrix
    if: ${{ !cancelled() && (needs.get-matrix.result == 'success' || needs.get-matrix.result == 'skipped') }}
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.test-matrix || needs.get-matrix.outputs.test_matrix).os_matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      # Positive control: the same check on the same runner succeeds on formatted input, so the
      # failure asserted below cannot come from the runner or the setup
      - name: Run format action in check mode on formatted input (local)
        id: control
        if: ${{ !inputs.use-released }}
        uses: ./
        with:
          check: true
          create-pull-request: false
      - name: Run format action in check mode on formatted input (released)
        id: control-released
        if: ${{ inputs.use-released }}
        uses: durandtibo/format-files-action@d616f6af5d74f644f80dbcb47932d3ee73d611ba # ratchet:durandtibo/format-files-action@v0.1.0
        with:
          check: true
          create-pull-request: false

      - name: Assert the positive control succeeded with changed=false
        shell: bash
        env:
          CHANGED: ${{ steps.control.outputs.changed || steps.control-released.outputs.changed }}
        run: test "$CHANGED" = "false"

      - name: Create badly formatted fixtures
        shell: bash
        run: |
          mkdir -p tmp-format-test
          printf 'foo:    bar\nbaz:  qux\n' >tmp-format-test/bad.yaml
          # shellcheck disable=SC2016 # writing literal shell source as data, not expanding it here
          printf '# bad shell\nfoo="bar"\nif [ "$foo" = "bar" ]; then\necho ok\nfi\n' >tmp-format-test/bad.sh
          printf '#   heading\n\n*  item\n*   item2\n' >tmp-format-test/bad.md
          printf '[package]\nname    =    "x"\n' >tmp-format-test/bad.toml
          printf 'all:\n\t@echo hi\nfoo:=1\n' >bad.mk
          git add -A
          git -c user.name=test -c user.email=test@example.com commit -m 'test: add unformatted fixture' --quiet

      # The error annotation of this step is expected: the step must fail
      - name: Run format action in check mode (local)
        id: format
        if: ${{ !inputs.use-released }}
        continue-on-error: true
        uses: ./
        with:
          check: true
          create-pull-request: false
      - name: Run format action in check mode (released)
        id: format-released
        if: ${{ inputs.use-released }}
        continue-on-error: true
        uses: durandtibo/format-files-action@d616f6af5d74f644f80dbcb47932d3ee73d611ba # ratchet:durandtibo/format-files-action@v0.1.0
        with:
          check: true
          create-pull-request: false

      - name: Assert action failed and reported changed=true
        shell: bash
        env:
          OUTCOME: ${{ inputs.use-released && steps.format-released.outcome || steps.format.outcome }}
          CHANGED: ${{ steps.format.outputs.changed || steps.format-released.outputs.changed }}
        run: |
          test "$OUTCOME" = "failure"
          test "$CHANGED" = "true"

      - name: Assert no changes were left on disk
        shell: bash
        run: test -z "$(git status --porcelain)"
  test-check-clean:
    needs: get-matrix
    if: ${{ !cancelled() && (needs.get-matrix.result == 'success' || needs.get-matrix.result == 'skipped') }}
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.test-matrix || needs.get-matrix.outputs.test_matrix).os_matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Run format action in check mode against an already-formatted repo (local)
        id: format
        if: ${{ !inputs.use-released }}
        uses: ./
        with:
          check: true
          create-pull-request: false
      - name: Run format action in check mode against an already-formatted repo (released)
        id: format-released
        if: ${{ inputs.use-released }}
        uses: durandtibo/format-files-action@d616f6af5d74f644f80dbcb47932d3ee73d611ba # ratchet:durandtibo/format-files-action@v0.1.0
        with:
          check: true
          create-pull-request: false

      - name: Assert action succeeded and reported changed=false
        shell: bash
        env:
          OUTCOME: ${{ inputs.use-released && steps.format-released.outcome || steps.format.outcome }}
          CHANGED: ${{ steps.format.outputs.changed || steps.format-released.outputs.changed }}
        run: |
          test "$OUTCOME" = "success"
          test "$CHANGED" = "false"
  # Regression test for the action being run on a repository that does not contain the action's
  # own Makefile/.make/. The action is checked out in a subdirectory, and the workspace root is
  # a fresh consumer-like repository.
  test-consumer-repo:
    needs: get-matrix
    # The released version does not contain the include-path fix yet
    if: ${{ !cancelled() && (needs.get-matrix.result == 'success' || needs.get-matrix.result == 'skipped') && !inputs.use-released }}
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.test-matrix || needs.get-matrix.outputs.test_matrix).os_latest }}

    steps:
      - name: Checkout the action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          path: action-src

      - name: Create a consumer repository with a badly formatted fixture
        shell: bash
        run: |
          git init --quiet
          printf 'action-src/\n' >.gitignore
          printf 'foo:    bar\nbaz:  qux\n' >bad.yaml
          git add -A
          git -c user.name=test -c user.email=test@example.com commit -m 'test: add unformatted fixture' --quiet
          test ! -e .make
          test ! -e Makefile

      - name: Run format action
        id: format
        uses: ./action-src
        with:
          create-pull-request: false

      - name: Assert action reports changed=true
        shell: bash
        env:
          CHANGED: ${{ steps.format.outputs.changed }}
        run: test "$CHANGED" = "true"

      - name: Assert fixture was reformatted
        shell: bash
        run: |
          if git diff --quiet -- bad.yaml; then
            echo "expected bad.yaml to be reformatted, but found no diff"
            exit 1
          fi
  # An empty repository (no file the action formats) is a success in both modes
  test-no-files:
    needs: get-matrix
    # The released version does not contain the include-path fix yet
    if: ${{ !cancelled() && (needs.get-matrix.result == 'success' || needs.get-matrix.result == 'skipped') && !inputs.use-released }}
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.test-matrix || needs.get-matrix.outputs.test_matrix).os_latest }}

    steps:
      - name: Checkout the action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          path: action-src

      - name: Create a consumer repository with nothing to format
        shell: bash
        run: |
          git init --quiet
          printf 'action-src/\n' >.gitignore
          git add -A
          git -c user.name=test -c user.email=test@example.com commit -m 'test: empty repository' --quiet

      - name: Run format action in write mode
        id: write
        uses: ./action-src
        with:
          create-pull-request: false

      - name: Run format action in check mode
        id: check
        uses: ./action-src
        with:
          check: true
          create-pull-request: false

      - name: Assert both runs succeeded with changed=false
        shell: bash
        env:
          WRITE_CHANGED: ${{ steps.write.outputs.changed }}
          CHECK_CHANGED: ${{ steps.check.outputs.changed }}
        run: |
          test "$WRITE_CHANGED" = "false"
          test "$CHECK_CHANGED" = "false"
          test -z "$(git status --porcelain)"
  # Files excluded through .prettierignore and .gitignore are left untouched
  test-ignored-files:
    needs: get-matrix
    # The released version does not contain the include-path fix yet
    if: ${{ !cancelled() && (needs.get-matrix.result == 'success' || needs.get-matrix.result == 'skipped') && !inputs.use-released }}
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.test-matrix || needs.get-matrix.outputs.test_matrix).os_latest }}

    steps:
      - name: Checkout the action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          path: action-src

      - name: Create a consumer repository with ignored, badly formatted files
        shell: bash
        run: |
          git init --quiet
          printf 'action-src/\nignored-by-git.yaml\n' >.gitignore
          printf 'ignored-by-prettier.yaml\n' >.prettierignore
          printf 'foo:    bar\n' >ignored-by-prettier.yaml
          printf 'foo:    bar\n' >ignored-by-git.yaml
          git add -A
          git -c user.name=test -c user.email=test@example.com commit -m 'test: add ignored fixtures' --quiet

      - name: Run format action
        id: format
        uses: ./action-src
        with:
          create-pull-request: false

      - name: Assert ignored files were left untouched
        shell: bash
        env:
          CHANGED: ${{ steps.format.outputs.changed }}
        run: |
          test "$CHANGED" = "false"
          test "$(cat ignored-by-prettier.yaml)" = 'foo:    bar'
          test "$(cat ignored-by-git.yaml)" = 'foo:    bar'
  # Check mode must detect each file type on its own, fail, and leave the tree untouched
  test-check-per-type:
    needs: get-matrix
    if: ${{ !cancelled() && (needs.get-matrix.result == 'success' || needs.get-matrix.result == 'skipped') }}
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.test-matrix || needs.get-matrix.outputs.test_matrix).os_latest }}
        fixture: [yaml, shell, markdown, toml, makefile]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      # Positive control: the same check on the same runner succeeds on formatted input, so the
      # failure asserted below cannot come from the runner or the setup
      - name: Run format action in check mode on formatted input (local)
        id: control
        if: ${{ !inputs.use-released }}
        uses: ./
        with:
          check: true
          create-pull-request: false
      - name: Run format action in check mode on formatted input (released)
        id: control-released
        if: ${{ inputs.use-released }}
        uses: durandtibo/format-files-action@d616f6af5d74f644f80dbcb47932d3ee73d611ba # ratchet:durandtibo/format-files-action@v0.1.0
        with:
          check: true
          create-pull-request: false

      - name: Assert the positive control succeeded with changed=false
        shell: bash
        env:
          CHANGED: ${{ steps.control.outputs.changed || steps.control-released.outputs.changed }}
        run: test "$CHANGED" = "false"

      - name: Create one badly formatted fixture
        shell: bash
        env:
          FIXTURE: ${{ matrix.fixture }}
        run: |
          mkdir -p tmp-format-test
          case "$FIXTURE" in
            yaml) printf 'foo:    bar\nbaz:  qux\n' >tmp-format-test/bad.yaml ;;
            shell) printf '# bad shell\nif true; then\necho ok\nfi\n' >tmp-format-test/bad.sh ;;
            markdown) printf '#   heading\n\n*  item\n*   item2\n' >tmp-format-test/bad.md ;;
            toml) printf '[package]\nname    =    "x"\n' >tmp-format-test/bad.toml ;;
            makefile) printf 'all:\n\t@echo hi\nfoo:=1\n' >tmp-format-test/bad.mk ;;
          esac
          git add -A
          git -c user.name=test -c user.email=test@example.com commit -m 'test: add unformatted fixture' --quiet

      # The error annotation of this step is expected: the step must fail
      - name: Run format action in check mode (local)
        id: format
        if: ${{ !inputs.use-released }}
        continue-on-error: true
        uses: ./
        with:
          check: true
          create-pull-request: false
      - name: Run format action in check mode (released)
        id: format-released
        if: ${{ inputs.use-released }}
        continue-on-error: true
        uses: durandtibo/format-files-action@d616f6af5d74f644f80dbcb47932d3ee73d611ba # ratchet:durandtibo/format-files-action@v0.1.0
        with:
          check: true
          create-pull-request: false

      - name: Assert the action failed, reported changed=true and left the tree untouched
        shell: bash
        env:
          OUTCOME: ${{ inputs.use-released && steps.format-released.outcome || steps.format.outcome }}
          CHANGED: ${{ steps.format.outputs.changed || steps.format-released.outputs.changed }}
        run: |
          test "$OUTCOME" = "failure"
          test "$CHANGED" = "true"
          test -z "$(git status --porcelain)"
  # Check mode never opens a pull request, even when create-pull-request is true
  test-check-no-pull-request:
    needs: get-matrix
    if: ${{ !cancelled() && (needs.get-matrix.result == 'success' || needs.get-matrix.result == 'skipped') }}
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.test-matrix || needs.get-matrix.outputs.test_matrix).os_latest }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      # Positive control: the same check on the same runner succeeds on formatted input, so the
      # failure asserted below cannot come from the runner or the setup
      - name: Run format action in check mode on formatted input (local)
        id: control
        if: ${{ !inputs.use-released }}
        uses: ./
        with:
          check: true
          create-pull-request: true
      - name: Run format action in check mode on formatted input (released)
        id: control-released
        if: ${{ inputs.use-released }}
        uses: durandtibo/format-files-action@d616f6af5d74f644f80dbcb47932d3ee73d611ba # ratchet:durandtibo/format-files-action@v0.1.0
        with:
          check: true
          create-pull-request: true

      - name: Assert the positive control succeeded with changed=false
        shell: bash
        env:
          CHANGED: ${{ steps.control.outputs.changed || steps.control-released.outputs.changed }}
        run: test "$CHANGED" = "false"

      - name: Create a badly formatted fixture
        shell: bash
        run: |
          printf 'foo:    bar\n' >tmp-bad.yaml
          git add -A
          git -c user.name=test -c user.email=test@example.com commit -m 'test: add unformatted fixture' --quiet

      # The error annotation of this step is expected: the step must fail
      - name: Run format action in check mode with create-pull-request enabled (local)
        id: format
        if: ${{ !inputs.use-released }}
        continue-on-error: true
        uses: ./
        with:
          check: true
          create-pull-request: true
      - name: Run format action in check mode with create-pull-request enabled (released)
        id: format-released
        if: ${{ inputs.use-released }}
        continue-on-error: true
        uses: durandtibo/format-files-action@d616f6af5d74f644f80dbcb47932d3ee73d611ba # ratchet:durandtibo/format-files-action@v0.1.0
        with:
          check: true
          create-pull-request: true

      - name: Assert it failed without creating a pull request
        shell: bash
        env:
          OUTCOME: ${{ inputs.use-released && steps.format-released.outcome || steps.format.outcome }}
          PR_NUMBER: ${{ steps.format.outputs.pull-request-number || steps.format-released.outputs.pull-request-number }}
          PR_URL: ${{ steps.format.outputs.pull-request-url || steps.format-released.outputs.pull-request-url }}
        run: |
          test "$OUTCOME" = "failure"
          test -z "$PR_NUMBER"
          test -z "$PR_URL"
          test -z "$(git status --porcelain)"
  # Write mode produces the exact formatted output, handles nested directories and file names
  # with spaces, and does not open a pull request when create-pull-request is false
  test-write-content:
    needs: get-matrix
    if: ${{ !cancelled() && (needs.get-matrix.result == 'success' || needs.get-matrix.result == 'skipped') }}
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.test-matrix || needs.get-matrix.outputs.test_matrix).os_latest }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Create badly formatted fixtures
        shell: bash
        run: |
          mkdir -p 'tmp-format-test/dir with space/nested'
          printf 'foo:    bar\n' >'tmp-format-test/dir with space/nested/bad file.yaml'
          printf '[package]\nname    =    "x"\n' >tmp-format-test/bad.toml
          printf 'foo:    bar' >tmp-format-test/no-trailing-newline.yaml
          git add -A
          git -c user.name=test -c user.email=test@example.com commit -m 'test: add unformatted fixtures' --quiet

      - name: Run format action (local)
        id: format
        if: ${{ !inputs.use-released }}
        uses: ./
        with:
          create-pull-request: false
      - name: Run format action (released)
        id: format-released
        if: ${{ inputs.use-released }}
        uses: durandtibo/format-files-action@d616f6af5d74f644f80dbcb47932d3ee73d611ba # ratchet:durandtibo/format-files-action@v0.1.0
        with:
          create-pull-request: false

      - name: Assert exact formatted content and outputs
        shell: bash
        env:
          CHANGED: ${{ steps.format.outputs.changed || steps.format-released.outputs.changed }}
          PR_NUMBER: ${{ steps.format.outputs.pull-request-number || steps.format-released.outputs.pull-request-number }}
          PR_URL: ${{ steps.format.outputs.pull-request-url || steps.format-released.outputs.pull-request-url }}
        run: |
          test "$CHANGED" = "true"
          test -z "$PR_NUMBER"
          test -z "$PR_URL"
          test "$(cat 'tmp-format-test/dir with space/nested/bad file.yaml')" = 'foo: bar'
          test "$(cat tmp-format-test/no-trailing-newline.yaml)" = 'foo: bar'
          test "$(tail -c1 tmp-format-test/no-trailing-newline.yaml | wc -l | tr -d ' ')" = '1'
          grep -q 'name = "x"' tmp-format-test/bad.toml
  # The action runs from the exported archive, i.e. only the files a release ships. `uses: ./`
  # in the other jobs runs the whole checkout and would hide a file that is export-ignore'd by
  # mistake (ci-export.yaml checks the list of files, this job checks that the action works).
  test-export:
    needs: get-matrix
    # The released action is already the exported archive
    if: ${{ !cancelled() && (needs.get-matrix.result == 'success' || needs.get-matrix.result == 'skipped') && !inputs.use-released }}
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.test-matrix || needs.get-matrix.outputs.test_matrix).os_latest }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Extract the exported archive and create a badly formatted fixture
        shell: bash
        run: |
          mkdir exported
          git archive --worktree-attributes HEAD | tar -x -C exported
          printf 'exported/\n' >>.gitignore
          printf 'foo:    bar\n' >bad.yaml
          git add -A
          git -c user.name=test -c user.email=test@example.com commit -m 'test: add unformatted fixture' --quiet

      - name: Run the exported action
        id: format
        uses: ./exported
        with:
          create-pull-request: false

      - name: Assert the exported action reformatted the fixture
        shell: bash
        env:
          CHANGED: ${{ steps.format.outputs.changed }}
        run: |
          test "$CHANGED" = "true"
          test "$(cat bad.yaml)" = 'foo: bar'
