# Scheduled bot workflow that formats this repo's own YAML workflow files
# and opens a pull request with any changes, using a GitHub App token.

name: Bot Format YAML

on:
  schedule:
    - cron: '0 6 * * 1' # Run every Monday at 6:00 AM UTC
  workflow_dispatch: # to trigger manually

permissions: {}

jobs:
  format-yaml:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read # actions/checkout only needs read; the app token grants write

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.TIBOT_CLIENT_ID }}
          private-key: ${{ secrets.TIBOT_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Format YAML files
        uses: ./
        with:
          path: .github/**/*.yml .github/**/*.yaml

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: bot/format-yaml
          title: 'style: format yaml files'
          commit-message: 'style: format yaml files'
          body: Format YAML files with Prettier.
          author: ci-bot <${{ secrets.CI_BOT_EMAIL }}>
