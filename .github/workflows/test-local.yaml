name: Test Local Action

on:
  workflow_call:
  workflow_dispatch: # to trigger manually

permissions:
  contents: read

jobs:
  config:
    runs-on: ubuntu-slim
    timeout-minutes: 2
    outputs:
      os_all: ${{ steps.cfg.outputs.os_all }}
    steps:
      - id: cfg
        uses: durandtibo/workflow-config-action@main

  test:
    needs: config
    runs-on: ${{ matrix.os }}
    timeout-minutes: 2
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.config.outputs.os_all) }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Test 1: Formats a badly-formatted file in place
      # -----------------------------------------------------------------------
      - name: 📝 Prepare unformatted file
        run: |
          mkdir -p tmp/default
          cp test-data/input.yml tmp/default/workflow.yml

      - name: 🧪 Format YAML file
        id: format-default
        uses: ./
        with:
          path: tmp/default/workflow.yml

      - name: ✓ Verify formatted output
        run: |
          source scripts/test-helper.sh
          assert_files_equal tmp/default/workflow.yml test-data/expected.yml
          assert_equal '${{ steps.format-default.outputs.changed }}' 'true' 'changed output'

      # -----------------------------------------------------------------------
      # Test 2: Already-formatted file is left untouched (idempotent)
      # -----------------------------------------------------------------------
      - name: 📝 Prepare already-formatted file
        run: |
          mkdir -p tmp/idempotent
          cp test-data/expected.yml tmp/idempotent/workflow.yml

      - name: 🧪 Format already-formatted file
        id: format-idempotent
        uses: ./
        with:
          path: tmp/idempotent/workflow.yml

      - name: ✓ Verify no changes
        run: |
          source scripts/test-helper.sh
          assert_files_equal tmp/idempotent/workflow.yml test-data/expected.yml
          assert_equal '${{ steps.format-idempotent.outputs.changed }}' 'false' 'changed output'

      # -----------------------------------------------------------------------
      # Test 3: Custom config-path is honored
      # -----------------------------------------------------------------------
      - name: 📝 Prepare file for custom config test
        run: |
          mkdir -p tmp/custom-config
          cp test-data/input.yml tmp/custom-config/workflow.yml
          echo 'singleQuote: false' > tmp/custom-config/.prettierrc.yml
          echo 'printWidth: 100' >> tmp/custom-config/.prettierrc.yml

      - name: 🧪 Format with custom config
        uses: ./
        with:
          path: tmp/custom-config/workflow.yml
          config-path: tmp/custom-config/.prettierrc.yml

      - name: ✓ Verify double quotes were used
        run: |
          source scripts/test-helper.sh

          if ! grep -q '"Sample Workflow"' tmp/custom-config/workflow.yml; then
            print_error "Custom config-path was not honored"
            exit 1
          fi

          print_success "Custom config-path was honored"

      # -----------------------------------------------------------------------
      # Test 4: Default path picks up files under .github
      # -----------------------------------------------------------------------
      - name: 📝 Prepare .github fixture
        run: |
          mkdir -p tmp/github-default/repo/.github/workflows
          cp test-data/input.yml tmp/github-default/repo/.github/workflows/sample.yml

      - name: 🧪 Format with default path
        uses: ./
        with:
          path: tmp/github-default/repo/.github/**/*.yml tmp/github-default/repo/.github/**/*.yaml

      - name: ✓ Verify default-path file was formatted
        run: |
          source scripts/test-helper.sh
          assert_files_equal tmp/github-default/repo/.github/workflows/sample.yml test-data/expected.yml

      # -----------------------------------------------------------------------
      # Test 5: check mode passes on already-formatted file, without writing
      # -----------------------------------------------------------------------
      - name: 📝 Prepare file for check-mode success test
        run: |
          mkdir -p tmp/check-pass
          cp test-data/expected.yml tmp/check-pass/workflow.yml

      - name: 🧪 Check already-formatted file
        id: check-pass
        uses: ./
        with:
          path: tmp/check-pass/workflow.yml
          check: true

      - name: ✓ Verify check succeeded and file was untouched
        run: |
          source scripts/test-helper.sh
          assert_files_equal tmp/check-pass/workflow.yml test-data/expected.yml
          assert_equal '${{ steps.check-pass.outputs.changed }}' 'false' 'changed output'

      # -----------------------------------------------------------------------
      # Test 6: check mode fails on badly-formatted file, without writing
      # -----------------------------------------------------------------------
      - name: 📝 Prepare file for check-mode failure test
        run: |
          mkdir -p tmp/check-fail
          cp test-data/input.yml tmp/check-fail/workflow.yml

      - name: 🧪 Check badly-formatted file
        id: check-fail
        uses: ./
        continue-on-error: true
        with:
          path: tmp/check-fail/workflow.yml
          check: true

      - name: ✓ Verify check failed and file was untouched
        run: |
          source scripts/test-helper.sh
          assert_equal '${{ steps.check-fail.outcome }}' 'failure' 'step outcome'
          assert_equal '${{ steps.check-fail.outputs.changed }}' 'true' 'changed output'
          assert_files_equal tmp/check-fail/workflow.yml test-data/input.yml
