name: Format YAML

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 6 * * 1' # Run every Monday at 6:00 AM UTC
  workflow_call:
  workflow_dispatch: # to trigger manually

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      # On push to main, the default GITHUB_TOKEN is enough since we push
      # directly. On schedule/manual runs, a GitHub App token is needed so
      # the resulting pull request runs through normal CI/review.
      - name: Generate GitHub App token
        id: app-token
        if: github.event_name != 'push'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.TIBOT_CLIENT_ID }}
          private-key: ${{ secrets.TIBOT_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ github.event_name != 'push' && steps.app-token.outputs.token || github.token }}
          persist-credentials: ${{ github.event_name == 'push' }}

      - name: Format YAML files
        uses: ./
        with:
          path: .github/**/*.yml .github/**/*.yaml

      - name: Commit changes
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git diff --quiet || (git add -A && git commit -m 'style: format yaml files' && git push)

      - name: Create pull request
        if: github.event_name != 'push'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: bot/format-yaml
          title: 'style: format yaml files'
          commit-message: 'style: format yaml files'
          body: Format YAML files with Prettier.
          author: ci-bot <${{ secrets.CI_BOT_EMAIL }}>
