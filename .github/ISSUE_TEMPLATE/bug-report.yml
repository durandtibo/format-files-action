name: 🐛 Bug Report
description: Create a report to help us reproduce and fix the bug

body:
  - type: markdown
    attributes:
      value: >
        #### Before submitting a bug, please make sure the issue hasn't been already addressed by searching through [the existing and past issues](https://github.com/durandtibo/format-files-action/issues?q=is%3Aissue).
  - type: textarea
    attributes:
      label: 🐛 Describe the bug
      description: |
        Please provide a clear and concise description of what the bug is.

        If relevant, add a minimal reproduction: the workflow YAML that calls this action, the
        inputs used, and the repo/files involved. It is very important for the snippet to be as
        succinct (minimal) as possible, so please take time to trim down anything irrelevant.

        Please also paste or describe the results you observe instead of the expected results. If
        you observe an error, please paste the error message including the **full** output from
        the failing step. It may be relevant to wrap logs in ```` ```triple quotes blocks``` ````.
      placeholder: |
        A clear and concise description of what the bug is.

        ```yaml
        # Workflow step that uses this action
        ```

        ```
        The error message or log output you got.
        ```
    validations:
      required: true
  - type: textarea
    attributes:
      label: Versions
      description: |
        Please indicate the version (tag/SHA) of this action you are using, and the runner OS
        (e.g. `ubuntu-latest`, `macos-latest`).
    validations:
      required: true
  - type: markdown
    attributes:
      value: >
        Thanks for contributing 🎉!
